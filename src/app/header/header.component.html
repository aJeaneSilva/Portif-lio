<header class="header">
  <nav class="header__nav container">
    <div class="logo">
      <img src="img/logo.png" alt="Logo">
      <div class="header__logo">JEANE.DEV</div>
    </div>

    <div class="header__links">
      <a
        *ngFor="let link of links"
        class="header__link"
        [class.header__link--active]="activeId === link.id"
        [href]="'#' + link.id"
      >
        {{ link.label }}
      </a>
      <a class="header__cta" href="#contact">Contato</a>
    </div>

    <button class="header__menu-btn" (click)="toggleMenu()" aria-label="Abrir menu">
      <span class="material-symbols-outlined">menu</span>
    </button>
  </nav>

  <div class="header__mobile-menu" *ngIf="menuOpen">
    <a
      *ngFor="let link of links"
      class="header__mobile-link"
      [class.header__mobile-link--active]="activeId === link.id"
      [href]="'#' + link.id"
      (click)="toggleMenu()"
    >
      {{ link.label }}
    </a>
    <a class="header__mobile-link" href="#contact" (click)="toggleMenu()">Contato</a>
  </div>
</header>
